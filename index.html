DATA.text.zh=DATA.text.zh||{}; DATA.text.zh['acts-17']={"title": "使徒行傳 17 章 · 保羅的腳步", "place": {"p_title": "使徒行傳 17 章", "p_syn17": "帖撒羅尼迦 ‧ 會堂", "p_jason": "帖撒羅尼迦 ‧ 耶孫的家", "p_rulers": "帖撒羅尼迦 ‧ 地方官面前", "p_night17": "夜裡往庇哩亞的路上", "p_berea": "庇哩亞 ‧ 會堂", "p_sea17": "往雅典的海路上", "p_agora": "雅典 ‧ 市上", "p_areo": "雅典 ‧ 亞略巴古"}, "say": {"h1": "【帖撒羅尼迦：三個安息日】\n徒 17:1–4", "h2": "【耶孫的家被圍】\n徒 17:5–9", "h3": "【庇哩亞：天天考查聖經】\n徒 17:10–15", "h4": "【雅典：滿城都是偶像】\n徒 17:16–21", "h5": "【亞略巴古：未識之神】\n徒 17:22–31", "h6": "【有人譏誚，也有人信】\n徒 17:32–34"}, "walk": {"w_syn17": "走到會堂中間", "w_berea": "走到講經的人中間", "w_idols": "走進市場", "w_areo": "走到亞略巴古中間"}, "quiz": {"q_sabbath": {"q": "保羅在帖撒羅尼迦的會堂，一連多少個安息日本著聖經與他們辯論？", "o": ["一個", "三個", "七個"]}, "q_christ": {"q": "保羅講解陳明，基督必須怎樣？", "o": ["受害，從死裡復活", "作王，建立地上的國度", "離開世界，不再回來"]}, "q_hearers": {"q": "誰聽了勸，附從保羅和西拉？", "o": ["只有猶太人", "有些猶太人、許多虔敬的希臘人，尊貴的婦女也不少", "只有官長"]}, "q_mob": {"q": "不信的猶太人心裡嫉妒，招聚了誰，闖進耶孫的家？", "o": ["市井匪類", "羅馬兵丁", "會堂的長老"]}, "q_charge": {"q": "他們控告耶孫收留的人，說他們違背凱撒的命令，說另有一個甚麼？", "o": ["另有一個王耶穌", "另有一座新殿", "另有一條律法"]}, "q_bond": {"q": "地方官取了耶孫和其餘之人的甚麼，就釋放了他們？", "o": ["保狀", "贖金", "證詞"]}, "q_night": {"q": "弟兄們在甚麼時候打發保羅和西拉往庇哩亞去？", "o": ["白天", "夜間", "安息日"]}, "q_noble": {"q": "庇哩亞人賢於帖撒羅尼迦的人，他們怎麼做？", "o": ["甘心領受這道，天天考查聖經", "只在安息日聽道", "要看神蹟才相信"]}, "q_follow": {"q": "誰跑到庇哩亞去聳動攪擾眾人？", "o": ["雅典的哲學家", "帖撒羅尼迦的猶太人", "腓立比的官長"]}, "q_stay": {"q": "保羅被送往海邊的時候，誰仍住在庇哩亞？", "o": ["西拉和提摩太", "巴拿巴和馬可", "路加和提多"]}, "q_idols": {"q": "保羅在雅典看見滿城都是偶像，心裡怎樣？", "o": ["著急", "歡喜", "毫不在意"]}, "q_daily": {"q": "保羅每日在哪裡，與所遇見的人辯論？", "o": ["市上", "王宮", "海邊"]}, "q_phil": {"q": "哪兩門的學士與保羅爭論？", "o": ["伊壁鳩魯和斯多亞", "法利賽和撒都該", "奮銳黨和稅吏"]}, "q_areo": {"q": "他們把保羅帶到哪裡，要知道他所講的新道？", "o": ["亞略巴古", "耶路撒冷聖殿", "腓立比監獄"]}, "q_news": {"q": "雅典人和住在那裡的客人，都只將甚麼說說聽聽？", "o": ["新聞", "律法", "買賣"]}, "q_altar": {"q": "保羅在雅典遇見一座壇，上面寫著甚麼？", "o": ["未識之神", "宙斯", "希耳米"]}, "q_temple": {"q": "創造宇宙和其中萬物的神，不住甚麼？", "o": ["人手所造的殿", "天上", "人的心"]}, "q_near": {"q": "保羅說，神其實離我們各人怎樣？", "o": ["不遠", "很遠", "只在殿裡"]}, "q_poets": {"q": "保羅引用雅典人作詩的說的哪一句？", "o": ["我們也是他所生的", "神就是自然", "人是萬物的尺度"]}, "q_repent": {"q": "神如今吩咐各處的人都要怎樣？", "o": ["悔改", "獻祭", "搬家"]}, "q_proof": {"q": "神給萬人作可信的憑據，是藉著甚麼事？", "o": ["叫他從死裡復活", "在市上行神蹟", "建立新殿"]}, "q_react": {"q": "眾人聽見從死裡復活的話，反應如何？", "o": ["有譏誚他的，也有人說「我們再聽你講這個吧」", "所有人都立刻相信", "所有人都離開了"]}, "q_dion": {"q": "信了主的人中，有亞略巴古的官丟尼修，還有一個婦人，名叫甚麼？", "o": ["大馬哩", "呂底亞", "百基拉"]}}, "speak": {"s23": {"prompt": "亞略巴古的眾人都看著你（保羅）。你剛說到祭壇上寫著「未識之神」，接下來你怎麼說？", "o": ["「你們的神都是假的，應當立刻拆毀。」", "@", "「我今天是來學習雅典哲學的。」"]}}, "ponder": "默想問題（沒有標準答案）\n\n1. 第 11 節的庇哩亞人「天天考查聖經，要曉得這道是與不是」。在雅典，保羅從他們熟悉的壇和詩人講起。這兩種聽道的態度，各給了你甚麼提醒？\n\n2. 第 31 節的重點是耶穌的復活。眾人聽了，有人譏誚，有人說再聽，也有人信。你覺得自己比較像哪一種聽的人？", "bub": {"bP3": "基督必須受害，從死裡復活。我所傳的這位耶穌，就是基督。", "bM1": "拉出來！把耶孫和那些人都拉出來！", "bM2": "這些人違背凱撒的命令，說另有一個王耶穌！", "bJas": "他們是我的客人，我收留他們。", "bAr1": "你們交了保狀，才可以回去。", "bBb1": "趁夜快走，我們送你們到庇哩亞。", "bBe1": "我們每天來看，經上是不是這樣說。", "bSi14": "你先走，我和提摩太留在這裡。", "bTi14": "我們一定盡快到你那裡去。", "bP15": "請轉告他們，速速到雅典來找我。", "bP16": "這滿城都是偶像……我心裡實在著急。", "bPh1": "這胡言亂語的要說甚麼？", "bPh2": "他似乎是傳說外邦鬼神的。", "bPh3": "你所講的這新道，我們也可以知道嗎？", "bMk1": "死人復活？哈哈，太荒唐了！", "bMk2": "我們再聽你講這個吧。", "bDio": "我願意相信這位主。", "bDam": "我也要跟著信。"}};
DATA.text.en=DATA.text.en||{}; DATA.text.en['acts-17']={"title": "Acts 17 · Paul’s Footsteps", "place": {"p_title": "Acts 17", "p_syn17": "Thessalonica · The synagogue", "p_jason": "Thessalonica · Jason’s house", "p_rulers": "Thessalonica · Before the city officials", "p_night17": "The night road to Berea", "p_berea": "Berea · The synagogue", "p_sea17": "At sea, bound for Athens", "p_agora": "Athens · The marketplace", "p_areo": "Athens · The Areopagus"}, "say": {"h1": "[Thessalonica: Three Sabbaths]\nActs 17:1–4", "h2": "[Jason’s house surrounded]\nActs 17:5–9", "h3": "[Berea: searching the Scriptures daily]\nActs 17:10–15", "h4": "[Athens: a city full of idols]\nActs 17:16–21", "h5": "[The Areopagus: the unknown god]\nActs 17:22–31", "h6": "[Some mocked, some believed]\nActs 17:32–34"}, "walk": {"w_syn17": "Walk to the middle of the synagogue", "w_berea": "Walk to those studying the Scriptures", "w_idols": "Walk into the marketplace", "w_areo": "Walk to the middle of the Areopagus"}, "quiz": {"q_sabbath": {"q": "For how many Sabbaths did Paul reason with them from the Scriptures in the Thessalonica synagogue?", "o": ["One", "Three", "Seven"]}, "q_christ": {"q": "What did Paul explain and prove that the Christ had to do?", "o": ["Suffer and rise from the dead", "Reign and set up an earthly kingdom", "Leave the world and never return"]}, "q_hearers": {"q": "Who was persuaded and joined Paul and Silas?", "o": ["Only Jews", "Some Jews, a large number of God-fearing Greeks, and quite a few leading women", "Only the officials"]}, "q_mob": {"q": "Jealous, the unbelieving Jews gathered whom and stormed Jason’s house?", "o": ["Some evil men from the marketplace", "Roman soldiers", "The synagogue elders"]}, "q_charge": {"q": "They said these men defied Caesar’s decrees by claiming there is another what?", "o": ["Another king, Jesus", "Another temple", "Another law"]}, "q_bond": {"q": "What did the officials take from Jason and the others before releasing them?", "o": ["A security bond", "A ransom", "Their testimony"]}, "q_night": {"q": "When did the brothers send Paul and Silas to Berea?", "o": ["By day", "By night", "On the Sabbath"]}, "q_noble": {"q": "The Bereans were more noble than those in Thessalonica. What did they do?", "o": ["Received the word eagerly and examined the Scriptures daily", "Listened only on the Sabbath", "Believed only after seeing miracles"]}, "q_follow": {"q": "Who came to Berea to agitate and stir up the crowds?", "o": ["Philosophers from Athens", "Jews from Thessalonica", "Magistrates from Philippi"]}, "q_stay": {"q": "When Paul was sent to the coast, who stayed behind in Berea?", "o": ["Silas and Timothy", "Barnabas and Mark", "Luke and Titus"]}, "q_idols": {"q": "When Paul saw the city full of idols in Athens, how did he feel?", "o": ["Greatly distressed", "Delighted", "Indifferent"]}, "q_daily": {"q": "Where did Paul reason daily with whoever happened to be there?", "o": ["In the marketplace", "In the palace", "By the sea"]}, "q_phil": {"q": "Which two groups of philosophers debated with Paul?", "o": ["Epicureans and Stoics", "Pharisees and Sadducees", "Zealots and tax collectors"]}, "q_areo": {"q": "Where did they take Paul to hear this new teaching?", "o": ["The Areopagus", "The temple in Jerusalem", "The prison in Philippi"]}, "q_news": {"q": "What did the Athenians and foreigners spend their time telling and hearing?", "o": ["Something new", "The Law", "Business deals"]}, "q_altar": {"q": "What was written on the altar Paul found in Athens?", "o": ["To an Unknown God", "To Zeus", "To Hermes"]}, "q_temple": {"q": "The God who made the world and everything in it does not live where?", "o": ["In temples made by human hands", "In heaven", "In the human heart"]}, "q_near": {"q": "Paul said God is actually how far from each of us?", "o": ["Not far", "Very far", "Only in the temple"]}, "q_poets": {"q": "Which line from their poets did Paul quote?", "o": ["“We are His offspring.”", "“God is nature.”", "“Man is the measure of all things.”"]}, "q_repent": {"q": "What does God now command all people everywhere to do?", "o": ["Repent", "Offer sacrifices", "Move away"]}, "q_proof": {"q": "By what has God given proof to everyone?", "o": ["By raising Him from the dead", "By working miracles in the marketplace", "By building a new temple"]}, "q_react": {"q": "How did the crowd respond to the resurrection of the dead?", "o": ["Some mocked, others said “We want to hear you again”", "Everyone believed at once", "Everyone walked away"]}, "q_dion": {"q": "Among those who believed were Dionysius, a member of the Areopagus, and a woman named what?", "o": ["Damaris", "Lydia", "Priscilla"]}}, "speak": {"s23": {"prompt": "All eyes on the Areopagus are on you (Paul). You have just mentioned the altar inscribed “To an Unknown God.” What do you say next?", "o": ["“Your gods are all false. Tear them down at once.”", "@", "“I have come today to learn Athenian philosophy.”"]}}, "ponder": "Reflection questions (no right answers)\n\n1. In verse 11 the Bereans “examined the Scriptures every day to see if these things were true.” In Athens, Paul began with their own altar and poets. What does each way of listening say to you?\n\n2. Verse 31 centers on the resurrection of Jesus. Some mocked, some wanted to hear more, some believed. Which kind of listener do you feel you are?", "bub": {"bP3": "The Christ had to suffer and rise from the dead. This Jesus I proclaim is the Christ.", "bM1": "Drag them out! Bring Jason and those men out!", "bM2": "These men defy Caesar’s decrees, saying there is another king, Jesus!", "bJas": "They are my guests. I took them in.", "bAr1": "Post your bond first, then you may go.", "bBb1": "Go quickly by night. We will see you to Berea.", "bBe1": "We come every day to check whether the Scriptures say so.", "bSi14": "You go ahead. Timothy and I will stay here.", "bTi14": "We will come to you as quickly as we can.", "bP15": "Tell them to come to me in Athens as soon as they can.", "bP16": "The whole city is full of idols… my heart is deeply troubled.", "bPh1": "What is this babbler trying to say?", "bPh2": "He seems to be preaching foreign gods.", "bPh3": "May we know what this new teaching of yours is?", "bMk1": "The dead rise? Ha! That is absurd!", "bMk2": "We will hear you again on this.", "bDio": "I want to believe in this Lord.", "bDam": "I will follow and believe too."}};
DATA.text.ko=DATA.text.ko||{}; DATA.text.ko['acts-17']={"title": "사도행전 17장 · 바울의 발자취", "place": {"p_title": "사도행전 17장", "p_syn17": "데살로니가 · 회당", "p_jason": "데살로니가 · 야손의 집", "p_rulers": "데살로니가 · 읍장들 앞", "p_night17": "베뢰아로 가는 밤길", "p_berea": "베뢰아 · 회당", "p_sea17": "아덴으로 가는 바닷길", "p_agora": "아덴 · 장터", "p_areo": "아덴 · 아레오바고"}, "say": {"h1": "【데살로니가: 세 안식일】\n행 17:1–4", "h2": "【야손의 집이 둘러싸이다】\n행 17:5–9", "h3": "【베뢰아: 날마다 성경을 상고하다】\n행 17:10–15", "h4": "【아덴: 온 성에 우상이 가득하다】\n행 17:16–21", "h5": "【아레오바고: 알지 못하는 신】\n행 17:22–31", "h6": "【조롱하는 자도, 믿는 자도】\n행 17:32–34"}, "walk": {"w_syn17": "회당 한가운데로 가기", "w_berea": "성경을 상고하는 사람들에게 가기", "w_idols": "장터로 들어가기", "w_areo": "아레오바고 한가운데로 가기"}, "quiz": {"q_sabbath": {"q": "바울이 데살로니가 회당에서 몇 안식일 동안 성경을 가지고 강론했습니까?", "o": ["한", "세", "일곱"]}, "q_christ": {"q": "바울이 그리스도께서 반드시 어떻게 되셔야 한다고 증명했습니까?", "o": ["해를 받고 죽은 자 가운데서 다시 살아나야 한다", "왕이 되어 땅에 나라를 세워야 한다", "세상을 떠나 다시 오지 않아야 한다"]}, "q_hearers": {"q": "누가 권함을 받아 바울과 실라를 따랐습니까?", "o": ["유대인만", "어떤 유대인과 경건한 헬라인의 큰 무리와 귀부인도 적지 않았다", "관원들만"]}, "q_mob": {"q": "믿지 않는 유대인들이 시기하여 누구를 모아 야손의 집을 습격했습니까?", "o": ["저자의 불량배들", "로마 군인들", "회당의 장로들"]}, "q_charge": {"q": "그들은 이 사람들이 가이사의 명을 어기고 또 다른 무엇이 있다고 한다고 고발했습니까?", "o": ["다른 임금 예수가 있다", "다른 성전이 있다", "다른 율법이 있다"]}, "q_bond": {"q": "읍장들은 야손과 다른 사람들에게서 무엇을 받고 놓아 주었습니까?", "o": ["보증금", "속전", "증언"]}, "q_night": {"q": "형제들은 언제 바울과 실라를 베뢰아로 보냈습니까?", "o": ["낮에", "밤에", "안식일에"]}, "q_noble": {"q": "베뢰아 사람들은 데살로니가 사람들보다 너그러웠습니다. 그들은 어떻게 했습니까?", "o": ["간절한 마음으로 말씀을 받고 날마다 성경을 상고했다", "안식일에만 말씀을 들었다", "표적을 보아야 믿었다"]}, "q_follow": {"q": "누가 베뢰아까지 와서 무리를 선동하여 소동하게 했습니까?", "o": ["아덴의 철학자들", "데살로니가의 유대인들", "빌립보의 상관들"]}, "q_stay": {"q": "바울이 바다 쪽으로 보내질 때 베뢰아에 남은 사람은 누구입니까?", "o": ["실라와 디모데", "바나바와 마가", "누가와 디도"]}, "q_idols": {"q": "바울이 아덴에서 온 성에 우상이 가득한 것을 보고 마음이 어떠했습니까?", "o": ["격분했다", "기뻐했다", "아무렇지 않았다"]}, "q_daily": {"q": "바울은 날마다 어디서 만나는 사람들과 변론했습니까?", "o": ["장터에서", "왕궁에서", "바닷가에서"]}, "q_phil": {"q": "어느 두 학파의 철학자들이 바울과 쟁론했습니까?", "o": ["에비구레오와 스도이고", "바리새인과 사두개인", "열심당과 세리"]}, "q_areo": {"q": "그들은 이 새로운 가르침을 알고자 바울을 어디로 데려갔습니까?", "o": ["아레오바고", "예루살렘 성전", "빌립보 감옥"]}, "q_news": {"q": "아덴 사람들과 거기 사는 나그네들은 무엇을 말하고 듣는 데만 시간을 보냈습니까?", "o": ["새로운 것", "율법", "장사"]}, "q_altar": {"q": "바울이 아덴에서 본 단에는 무엇이 새겨져 있었습니까?", "o": ["알지 못하는 신에게", "쓰스에게", "허메에게"]}, "q_temple": {"q": "세상과 그 가운데 있는 만물을 지으신 하나님은 어디에 계시지 않습니까?", "o": ["손으로 지은 전에", "하늘에", "사람의 마음에"]}, "q_near": {"q": "바울은 하나님이 우리 각 사람에게서 어떠하시다고 했습니까?", "o": ["멀리 계시지 않는다", "매우 멀리 계신다", "성전에만 계신다"]}, "q_poets": {"q": "바울이 아덴 시인들의 말 가운데 인용한 것은 무엇입니까?", "o": ["우리가 그의 소생이라", "신은 곧 자연이다", "사람은 만물의 척도이다"]}, "q_repent": {"q": "하나님은 이제 각처에 있는 모든 사람에게 무엇을 명하십니까?", "o": ["회개하라", "제사를 드리라", "이사하라"]}, "q_proof": {"q": "하나님이 모든 사람에게 믿을 만한 증거를 주신 것은 무엇으로입니까?", "o": ["그를 죽은 자 가운데서 다시 살리심으로", "장터에서 기적을 행하심으로", "새 성전을 세우심으로"]}, "q_react": {"q": "죽은 자의 부활을 들은 무리의 반응은 어떠했습니까?", "o": ["조롱하는 사람도, 다시 듣겠다는 사람도 있었다", "모두 즉시 믿었다", "모두 떠났다"]}, "q_dion": {"q": "믿은 사람 가운데는 아레오바고 관원 디오누시오와 또 한 여자가 있었습니다. 그 이름은 무엇입니까?", "o": ["다마리", "루디아", "브리스길라"]}}, "speak": {"s23": {"prompt": "아레오바고의 모든 사람이 당신(바울)을 바라봅니다. 방금 ‘알지 못하는 신에게’라고 새긴 단을 말했습니다. 다음에 무엇이라 말합니까?", "o": ["“너희의 신은 다 거짓이니 당장 허물라.”", "@", "“오늘은 아덴 철학을 배우러 왔소.”"]}}, "ponder": "묵상 질문 (정해진 답은 없습니다)\n\n1. 11절의 베뢰아 사람들은 ‘이것이 그러한가 하여 날마다 성경을 상고’했습니다. 아덴에서 바울은 그들이 아는 단과 시인에게서 말을 시작했습니다. 이 두 가지 듣는 태도는 각각 무엇을 일깨워 줍니까?\n\n2. 31절의 중심은 예수의 부활입니다. 어떤 사람은 조롱하고, 어떤 사람은 다시 듣겠다 하고, 어떤 사람은 믿었습니다. 나는 어느 쪽에 가깝습니까?"};

/* ---------- 徒 18 章(第二次旅程:哥林多、以弗所)---------- */
regScripture('cuv','acts',18,{verses:{"1": "這事以後，保羅離了雅典，來到哥林多。", "2": "遇見一個猶太人，名叫亞居拉，他生在本都；因為革老丟命猶太人都離開羅馬，新近帶著妻百基拉，從意大利來。保羅就投奔了他們。", "3": "他們本是製造帳棚為業。保羅因與他們同業，就和他們同住做工。", "4": "每逢安息日，保羅在會堂裡辯論，勸化猶太人和希臘人。", "5": "西拉和提摩太從馬其頓來的時候，保羅為道迫切，向猶太人證明耶穌是基督。", "6": "他們既抗拒、毀謗，保羅就抖著衣裳，說：「你們的罪（原文是血）歸到你們自己頭上，與我無干（原文是我卻乾淨）。從今以後，我要往外邦人那裡去。」", "7": "於是離開那裡，到了一個人的家中；這人名叫提多猶士都，是敬拜神的，他的家靠近會堂。", "8": "管會堂的基利司布和全家都信了主，還有許多哥林多人聽了，就相信受洗。", "9": "夜間，主在異象中對保羅說：「不要怕，只管講，不要閉口，", "10": "有我與你同在，必沒有人下手害你，因為在這城裡我有許多的百姓。」", "11": "保羅在那裡住了一年零六個月，將神的道教訓他們。", "12": "到迦流作亞該亞方伯的時候，猶太人同心起來攻擊保羅，拉他到公堂，", "13": "說：「這個人勸人不按著律法敬拜神。」", "14": "保羅剛要開口，迦流就對猶太人說：「你們這些猶太人！如果是為冤枉或奸惡的事，我理當耐性聽你們。", "15": "但所爭論的，若是關乎言語、名目，和你們的律法，你們自己去辦吧！這樣的事我不願意審問」；", "16": "就把他們攆出公堂。", "17": "眾人便揪住管會堂的所提尼，在堂前打他。這些事迦流都不管。", "18": "保羅又住了多日，就辭別了弟兄，坐船往敘利亞去；百基拉、亞居拉和他同去。他因為許過願，就在堅革哩剪了頭髮。", "19": "到了以弗所，保羅就把他們留在那裡，自己進了會堂，和猶太人辯論。", "20": "眾人請他多住些日子，他卻不允，", "21": "就辭別他們，說：「神若許我，我還要回到你們這裡」；於是開船離了以弗所。", "22": "在凱撒利亞下了船，就上耶路撒冷去問教會安，隨後下安提阿去。", "23": "住了些日子，又離開那裡，挨次經過加拉太和弗呂家地方，堅固眾門徒。", "24": "有一個猶太人，名叫亞波羅，來到以弗所。他生在亞歷山大，是有學問（或譯：口才）的，最能講解聖經。", "25": "這人已經在主的道上受了教訓，心裡火熱，將耶穌的事詳細講論教訓人；只是他單曉得約翰的洗禮。", "26": "他在會堂裡放膽講道；百基拉、亞居拉聽見，就接他來，將神的道給他講解更加詳細。", "27": "他想要往亞該亞去，弟兄們就勉勵他，並寫信請門徒接待他（或譯：弟兄們就寫信勸門徒接待他）。他到了那裡，多幫助那蒙恩信主的人，", "28": "在眾人面前極有能力駁倒猶太人，引聖經證明耶穌是基督。"},notes:{},lines:{"6": "從今以後，我要往外邦人那裡去。"}});
regScripture('bsb','acts',18,{verses:{"1": "After this, Paul left Athens and went to Corinth.", "2": "There he found a Jew named Aquila, a native of Pontus, who had recently come from Italy with his wife Priscilla because Claudius had ordered all the Jews to leave Rome. Paul went to visit them,", "3": "and he stayed and worked with them because they were tentmakers by trade, just as he was.", "4": "Every Sabbath he reasoned in the synagogue, trying to persuade Jews and Greeks alike.", "5": "And when Silas and Timothy came down from Macedonia, Paul devoted himself fully to the word, testifying to the Jews that Jesus is the Christ.", "6": "But when they opposed and insulted him, he shook out his garments and told them, “Your blood be on your own heads! I am innocent of it. From now on I will go to the Gentiles.”", "7": "So Paul left the synagogue and went next door to the house of Titus Justus, a worshiper of God.", "8": "Crispus, the synagogue leader, and his whole household believed in the Lord. And many of the Corinthians who heard the message believed and were baptized.", "9": "One night the Lord spoke to Paul in a vision: “Do not be afraid; keep on speaking; do not be silent.", "10": "For I am with you and no one will lay a hand on you, because I have many people in this city.”", "11": "So Paul stayed for a year and a half, teaching the word of God among the Corinthians.", "12": "While Gallio was proconsul of Achaia, the Jews coordinated an attack on Paul and brought him before the judgment seat.", "13": "“This man is persuading the people to worship God in ways contrary to the law,” they said.", "14": "But just as Paul was about to speak, Gallio told the Jews, “If this matter involved a wrongdoing or vicious crime, O Jews, it would be reasonable for me to hear your complaint.", "15": "But since it is a dispute about words and names and your own law, settle it yourselves. I refuse to be a judge of such things.”", "16": "And he drove them away from the judgment seat.", "17": "At this, the crowd seized Sosthenes the synagogue leader and beat him in front of the judgment seat. But none of this was of concern to Gallio.", "18": "Paul remained in Corinth for quite some time before saying goodbye to the brothers. He had his head shaved in Cenchrea to keep a vow he had made, and then he sailed for Syria, accompanied by Priscilla and Aquila.", "19": "When they reached Ephesus, Paul parted ways with Priscilla and Aquila. He himself went into the synagogue there and reasoned with the Jews.", "20": "When they asked him to stay for a while longer, he declined.", "21": "But as he left, he said, “I will come back to you if God is willing.” And he set sail from Ephesus.", "22": "When Paul had landed at Caesarea, he went up and greeted the church at Jerusalem. Then he went down to Antioch.", "23": "After Paul had spent some time in Antioch, he traveled from place to place throughout the region of Galatia and Phrygia, strengthening all the disciples.", "24": "Meanwhile a Jew named Apollos, a native of Alexandria, came to Ephesus. He was an eloquent man, well versed in the Scriptures.", "25": "He had been instructed in the way of the Lord and was fervent in spirit. He spoke and taught accurately about Jesus, though he knew only the baptism of John.", "26": "And he began to speak boldly in the synagogue. When Priscilla and Aquila heard him, they took him in and explained to him the way of God more accurately.", "27": "When Apollos resolved to cross over to Achaia, the brothers encouraged him and wrote to the disciples there to welcome him. On his arrival, he was a great help to those who by grace had believed.", "28": "For he powerfully refuted the Jews in public debate, proving from the Scriptures that Jesus is the Christ."},notes:{},lines:{"6": "From now on I will go to the Gentiles."}});
regScripture('krv','acts',18,{verses:{"1": "이 후에 바울이 아덴을 떠나 고린도에 이르러", "2": "아굴라라 하는 본도에서 난 유대인 하나를 만나니 글라우디오가 모든 유대인을 명하여 로마에서 떠나라 한 고로 그가 그 아내 브리스길라와 함께 이달리야로부터 새로 온지라 바울이 그들에게 가매", "3": "업이 같으므로 함께 거하여 일을 하니 그 업은 장막을 만드는 것이더라", "4": "안식일마다 바울이 회당에서 강론하고 유대인과 헬라인을 권면하니라", "5": "실라와 디모데가 마게도냐로서 내려오매 바울이 하나님의 말씀에 붙잡혀 유대인들에게 예수는 그리스도라 밝히 증거하니", "6": "저희가 대적하여 훼방하거늘 바울이 옷을 떨어 가로되 너희 피가 너희 머리로 돌아갈 것이요 나는 깨끗하니라 이 후에는 이방인에게로 가리라 하고", "7": "거기서 옮겨 하나님을 공경하는 디도 유스도라 하는 사람의 집에 들어가니 그 집이 회당 옆이라", "8": "또 회당장 그리스보가 온 집으로 더불어 주를 믿으며 수다한 고린도 사람도 듣고 믿어 침례를 받더라", "9": "밤에 주께서 환상 가운데 바울에게 말씀하시되 두려워하지 말며 잠잠하지 말고 말하라", "10": "내가 너와 함께 있으매 아무 사람도 너를 대적하여 해롭게 할 자가 없을 것이니 이는 이 성중에 내 백성이 많음이라 하시더라", "11": "일 년 육 개월을 유하며 그들 가운데서 하나님의 말씀을 가르치니라", "12": "갈리오가 아가야 총독 되었을 때에 유대인이 일제히 일어나 바울을 대적하여 재판 자리로 데리고 와서", "13": "말하되 이 사람이 율법을 어기어 하나님을 공경하라고 사람들을 권한다 하거늘", "14": "바울이 입을 열고자 할 때에 갈리오가 유대인들에게 이르되 너희 유대인들아 만일 무슨 부정한 일이나 괴악한 행동이었으면 내가 너희 말을 들어주는 것이 가하거니와", "15": "만일 문제가 언어와 명칭과 너희 법에 관한 것이면 너희가 스스로 처리하라 나는 이러한 일에 재판장 되기를 원치 아니하노라 하고", "16": "저희를 재판 자리에서 쫓아내니", "17": "모든 사람이 회당장 소스데네를 잡아 재판 자리 앞에서 때리되 갈리오가 이 일을 상관치 아니하니라", "18": "바울은 더 여러 날 유하다가 형제들을 작별하고 배 타고 수리아로 떠나갈새 브리스길라와 아굴라도 함께 하더라 바울이 일찍 서원이 있으므로 겐그레아에서 머리를 깎았더라", "19": "에베소에 와서 저희를 거기 머물러 두고 자기는 회당에 들어가서 유대인들과 변론하니", "20": "여러 사람이 더 오래 있기를 청하되 허락지 아니하고", "21": "작별하여 가로되 만일 하나님의 뜻이면 너희에게 돌아오리라 하고 배를 타고 에베소를 떠나", "22": "가이사랴에서 상륙하여 올라가 교회의 안부를 물은 후에 안디옥으로 내려가서", "23": "얼마 있다가 떠나 갈라디아와 브루기아 땅을 차례로 다니며 모든 제자를 굳게 하니라", "24": "알렉산드리아에서 난 아볼로라 하는 유대인이 에베소에 이르니 이 사람은 학문이 많고 성경에 능한 자라", "25": "그가 일찍 주의 도를 배워 열심으로 예수에 관한 것을 자세히 말하며 가르치나 요한의 침례만 알 따름이라", "26": "그가 회당에서 담대히 말하기를 시작하거늘 브리스길라와 아굴라가 듣고 데려다가 하나님의 도를 더 자세히 풀어 이르더라", "27": "아볼로가 아가야로 건너가고자 하니 형제들이 저를 장려하며 제자들에게 편지하여 영접하라 하였더니 저가 가매 은혜로 말미암아 믿은 자들에게 많은 유익을 주니", "28": "이는 성경으로써 예수는 그리스도라고 증거하여 공중 앞에서 유력하게 유대인의 말을 이김일러라"},notes:{},lines:{"6": "이 후에는 이방인에게로 가리라"}});

DATA.text.zh=DATA.text.zh||{}; DATA.text.zh['acts-18']={"title": "使徒行傳 18 章 · 保羅的腳步", "place": {"p_title": "使徒行傳 18 章", "p_tent": "哥林多 ‧ 帳棚工坊", "p_syn18": "哥林多 ‧ 會堂", "p_justus": "哥林多 ‧ 提多猶士都的家", "p_night18": "哥林多 ‧ 夜裡", "p_court": "哥林多 ‧ 公堂", "p_cenchrea": "堅革哩 ‧ 海上", "p_eph": "以弗所 ‧ 會堂", "p_antioch18": "敘利亞的安提阿", "p_road18": "加拉太、弗呂家的路上", "p_apollos": "以弗所 ‧ 會堂", "p_apohome": "以弗所 ‧ 亞居拉的家"}, "say": {"h1": "【哥林多：亞居拉和百基拉】\n徒 18:1–4", "h2": "【轉向外邦人】\n徒 18:5–8", "h3": "【夜間的異象：我有許多的百姓】\n徒 18:9–11", "h4": "【迦流不管這些事】\n徒 18:12–17", "h5": "【以弗所、凱撒利亞、安提阿】\n徒 18:18–23", "h6": "【亞波羅被教導更詳細】\n徒 18:24–28"}, "walk": {"w_tent": "走到工作桌旁", "w_justus": "走進提多猶士都的家", "w_lord18": "走向主"}, "quiz": {"q_aq": {"q": "亞居拉是猶太人，他和妻子百基拉從哪裡來到哥林多？為甚麼？", "o": ["從意大利來，因為革老丟命猶太人都離開羅馬", "從耶路撒冷來，因為聖殿被毀", "從以弗所來，因為生意失敗"]}, "q_tent": {"q": "亞居拉和百基拉本來是做甚麼手藝的？", "o": ["製造帳棚", "燒製陶器", "織染布匹"]}, "q_sab": {"q": "每逢安息日，保羅在會堂裡辯論，勸化哪些人？", "o": ["猶太人和希臘人", "只有猶太人", "只有官長"]}, "q_come": {"q": "西拉和提摩太從哪裡來到哥林多？", "o": ["馬其頓", "雅典", "耶路撒冷"]}, "q_gentiles": {"q": "猶太人抗拒、毀謗，保羅抖著衣裳，說「從今以後」他要往哪裡去？", "o": ["往外邦人那裡去", "回耶路撒冷去", "往安提阿去"]}, "q_justus": {"q": "保羅離開會堂後，到了誰的家？這家靠近哪裡？", "o": ["提多猶士都的家，靠近會堂", "亞居拉的家，靠近海邊", "基利司布的家，靠近市場"]}, "q_crispus": {"q": "管會堂的基利司布和誰一同信了主？", "o": ["全家", "他的朋友", "他的學生"]}, "q_fear": {"q": "主在夜間的異象中對保羅說，不要怕，因為在這城裡有許多甚麼？", "o": ["我的百姓", "金銀", "兵丁"]}, "q_year": {"q": "保羅在哥林多住了多久，將神的道教訓他們？", "o": ["一年零六個月", "三個月", "七年"]}, "q_charge18": {"q": "猶太人說保羅勸人不按著甚麼敬拜神？", "o": ["律法", "聖殿", "安息日"]}, "q_gallio": {"q": "迦流說，所爭論的若是關乎甚麼，他就不願意審問？", "o": ["言語、名目和他們的律法", "殺人和搶劫", "納稅和兵役"]}, "q_soth": {"q": "眾人揪住管會堂的誰，在堂前打他？", "o": ["所提尼", "提多猶士都", "基利司布"]}, "q_vow": {"q": "保羅因為許過願，在堅革哩作了甚麼？", "o": ["剪了頭髮", "獻了羊", "禁食四十天"]}, "q_return": {"q": "保羅離開以弗所時說了甚麼？", "o": ["神若許我，我還要回到你們這裡", "我再也不回來了", "請你們到耶路撒冷找我"]}, "q_church": {"q": "保羅在凱撒利亞下了船，上耶路撒冷去做甚麼，隨後下安提阿？", "o": ["問教會安", "收稅款", "買船票"]}, "q_strong18": {"q": "保羅挨次經過加拉太和弗呂家，作甚麼？", "o": ["堅固眾門徒", "設立官長", "收取捐項"]}, "q_apollos": {"q": "亞波羅生在哪裡？他單曉得誰的洗禮？", "o": ["生在亞歷山大；只曉得約翰的洗禮", "生在大馬士革；只曉得耶穌的洗禮", "生在哥林多；只曉得割禮"]}, "q_prove": {"q": "亞波羅到了亞該亞，在眾人面前極有能力駁倒猶太人，引聖經證明甚麼？", "o": ["耶穌是基督", "摩西是先知", "聖殿永遠長存"]}}, "speak": {"s6": {"prompt": "會堂裡的人抗拒、毀謗。你（保羅）抖著衣裳——接下來你怎麼說？", "o": ["「我要把這個會堂拆毀。」", "@", "「我明天就離開哥林多，不再傳道。」"]}}, "ponder": "默想問題（沒有標準答案）\n\n1. 第 3 節，保羅和亞居拉、百基拉「同業」，一起做帳棚。你覺得日常的工作，和傳福音之間，有甚麼關係？\n\n2. 第 9–10 節，主在夜間對保羅說「不要怕」，還說「在這城裡我有許多的百姓」。這兩句話，各給保羅甚麼力量？\n\n3. 第 24–26 節，亞波羅已經很有口才，卻肯讓百基拉和亞居拉把神的道「給他講解更加詳細」。這給你甚麼提醒？", "bub": {"bAq": "我們新近從羅馬來，皇帝下令，猶太人都得離開。", "bPr": "你也是做帳棚的？來，一起做工，一起吃飯。", "bSi5": "我們從馬其頓來了！", "bCr": "我和全家，都信了主。", "bJ13": "這個人勸人不按著律法敬拜神！", "bGa": "你們自己去辦吧！這樣的事，我不願意審問。", "bAq19": "你去吧，我們留在以弗所。", "bPr26": "請到我們家來，我們把神的道給你講解得更詳細。"}};
DATA.text.en=DATA.text.en||{}; DATA.text.en['acts-18']={"title": "Acts 18 · Paul’s Footsteps", "place": {"p_title": "Acts 18", "p_tent": "Corinth · The tentmakers’ workshop", "p_syn18": "Corinth · The synagogue", "p_justus": "Corinth · Titius Justus’s house", "p_night18": "Corinth · At night", "p_court": "Corinth · The tribunal", "p_cenchrea": "Cenchrea · At sea", "p_eph": "Ephesus · The synagogue", "p_antioch18": "Antioch in Syria", "p_road18": "On the road through Galatia and Phrygia", "p_apollos": "Ephesus · The synagogue", "p_apohome": "Ephesus · Aquila’s home"}, "say": {"h1": "[Corinth: Aquila and Priscilla]\nActs 18:1–4", "h2": "[Turning to the Gentiles]\nActs 18:5–8", "h3": "[The night vision: I have many people]\nActs 18:9–11", "h4": "[Gallio cares for none of this]\nActs 18:12–17", "h5": "[Ephesus, Caesarea, Antioch]\nActs 18:18–23", "h6": "[Apollos taught more accurately]\nActs 18:24–28"}, "walk": {"w_tent": "Walk to the workbench", "w_justus": "Walk into Titius Justus’s house", "w_lord18": "Walk toward the Lord"}, "quiz": {"q_aq": {"q": "Aquila was a Jew. Where had he and Priscilla come from, and why?", "o": ["From Italy, because Claudius ordered all Jews to leave Rome", "From Jerusalem, because the temple was destroyed", "From Ephesus, because their business failed"]}, "q_tent": {"q": "What trade did Aquila and Priscilla practice?", "o": ["Making tents", "Making pottery", "Weaving and dyeing cloth"]}, "q_sab": {"q": "On every Sabbath Paul reasoned in the synagogue, trying to persuade whom?", "o": ["Jews and Greeks", "Only Jews", "Only officials"]}, "q_come": {"q": "Where did Silas and Timothy come from when they reached Corinth?", "o": ["Macedonia", "Athens", "Jerusalem"]}, "q_gentiles": {"q": "When the Jews opposed and insulted him, Paul shook out his garments and said that from now on he would go to whom?", "o": ["The Gentiles", "Back to Jerusalem", "Antioch"]}, "q_justus": {"q": "After leaving the synagogue, whose house did Paul go to, and where was it?", "o": ["Titius Justus’s, next to the synagogue", "Aquila’s, by the harbor", "Crispus’s, near the market"]}, "q_crispus": {"q": "Crispus, the synagogue ruler, believed in the Lord together with whom?", "o": ["His whole household", "His friends", "His students"]}, "q_fear": {"q": "In the night vision the Lord told Paul not to be afraid, because in this city he had many what?", "o": ["People of mine", "Riches", "Soldiers"]}, "q_year": {"q": "How long did Paul stay in Corinth, teaching the word of God?", "o": ["A year and six months", "Three months", "Seven years"]}, "q_charge18": {"q": "The Jews claimed Paul was persuading people to worship God contrary to what?", "o": ["The law", "The temple", "The Sabbath"]}, "q_gallio": {"q": "Gallio said that if the dispute concerned what, he refused to judge it?", "o": ["Words, names, and their own law", "Murder and robbery", "Taxes and military service"]}, "q_soth": {"q": "Whom did the crowd seize and beat in front of the tribunal?", "o": ["Sosthenes, the synagogue ruler", "Titius Justus", "Crispus"]}, "q_vow": {"q": "Because of a vow, what did Paul do at Cenchrea?", "o": ["Had his hair cut", "Offered a lamb", "Fasted forty days"]}, "q_return": {"q": "What did Paul say as he left Ephesus?", "o": ["“I will come back to you if God wills.”", "“I will never return.”", "“Come find me in Jerusalem.”"]}, "q_church": {"q": "Paul landed at Caesarea, went up to Jerusalem to do what, and then went down to Antioch?", "o": ["Greet the church", "Collect taxes", "Buy ship tickets"]}, "q_strong18": {"q": "Passing through Galatia and Phrygia, what did Paul do?", "o": ["Strengthened all the disciples", "Appointed officials", "Collected offerings"]}, "q_apollos": {"q": "Where was Apollos born, and whose baptism did he know only?", "o": ["Born in Alexandria; he knew only the baptism of John", "Born in Damascus; he knew only the baptism of Jesus", "Born in Corinth; he knew only circumcision"]}, "q_prove": {"q": "In Achaia Apollos powerfully refuted the Jews, showing from the Scriptures what?", "o": ["That Jesus is the Christ", "That Moses is a prophet", "That the temple will stand forever"]}}, "speak": {"s6": {"prompt": "The people in the synagogue oppose and insult you. You (Paul) shake out your garments. What do you say next?", "o": ["“I will tear this synagogue down.”", "@", "“I will leave Corinth tomorrow and stop preaching.”"]}}, "ponder": "Reflection questions (no right answers)\n\n1. In verse 3 Paul worked with Aquila and Priscilla as a fellow tentmaker. How do you see ordinary work and sharing the gospel fitting together?\n\n2. In verses 9–10 the Lord says to Paul at night, “Do not be afraid,” and “I have many people in this city.” What strength does each of these give him?\n\n3. In verses 24–26 Apollos, already eloquent, lets Priscilla and Aquila explain the way of God to him more accurately. What does that say to you?", "bub": {"bAq": "We came recently from Rome. The emperor ordered all Jews to leave.", "bPr": "You are a tentmaker too? Come, work with us and eat with us.", "bSi5": "We have come from Macedonia!", "bCr": "My whole household and I believe in the Lord.", "bJ13": "This man persuades people to worship God against the law!", "bGa": "Settle it yourselves! I refuse to judge such matters.", "bAq19": "You go on. We will stay in Ephesus.", "bPr26": "Come to our home. We will explain the way of God to you more accurately."}};
DATA.text.ko=DATA.text.ko||{}; DATA.text.ko['acts-18']={"title": "사도행전 18장 · 바울의 발자취", "place": {"p_title": "사도행전 18장", "p_tent": "고린도 · 천막 만드는 일터", "p_syn18": "고린도 · 회당", "p_justus": "고린도 · 디디오 유스도의 집", "p_night18": "고린도 · 밤", "p_court": "고린도 · 재판 자리", "p_cenchrea": "겐그레아 · 바다 위", "p_eph": "에베소 · 회당", "p_antioch18": "수리아 안디옥", "p_road18": "갈라디아와 브루기아로 가는 길", "p_apollos": "에베소 · 회당", "p_apohome": "에베소 · 아굴라의 집"}, "say": {"h1": "【고린도: 아굴라와 브리스길라】\n행 18:1–4", "h2": "【이방인에게로 돌아서다】\n행 18:5–8", "h3": "【밤의 환상: 내 백성이 많다】\n행 18:9–11", "h4": "【갈리오는 이 일에 상관하지 않다】\n행 18:12–17", "h5": "【에베소, 가이사랴, 안디옥】\n행 18:18–23", "h6": "【아볼로가 더 정확히 배우다】\n행 18:24–28"}, "walk": {"w_tent": "작업대로 가기", "w_justus": "디디오 유스도의 집으로 들어가기", "w_lord18": "주님께 가까이 가기"}, "quiz": {"q_aq": {"q": "아굴라와 브리스길라는 어디서, 왜 고린도에 왔습니까?", "o": ["글라우디오가 모든 유대인에게 로마를 떠나라고 명하여 이탈리아에서", "성전이 무너져서 예루살렘에서", "장사가 망해서 에베소에서"]}, "q_tent": {"q": "아굴라와 브리스길라의 직업은 무엇이었습니까?", "o": ["천막 만드는 일", "도자기 굽는 일", "베 짜고 염색하는 일"]}, "q_sab": {"q": "안식일마다 바울은 회당에서 누구를 권면했습니까?", "o": ["유대인과 헬라인", "유대인만", "관원들만"]}, "q_come": {"q": "실라와 디모데는 어디서 고린도로 왔습니까?", "o": ["마게도냐", "아덴", "예루살렘"]}, "q_gentiles": {"q": "유대인들이 대적하고 훼방하자 바울은 옷을 떨며 이후에는 어디로 가겠다고 했습니까?", "o": ["이방인에게로", "예루살렘으로", "안디옥으로"]}, "q_justus": {"q": "바울은 회당을 떠나 누구의 집으로 갔고, 그 집은 어디에 있었습니까?", "o": ["디디오 유스도의 집, 회당 옆", "아굴라의 집, 항구 옆", "그리스보의 집, 시장 근처"]}, "q_crispus": {"q": "회당장 그리스보는 누구와 함께 주를 믿었습니까?", "o": ["온 집안", "친구들", "제자들"]}, "q_fear": {"q": "밤 환상에서 주께서 두려워 말라 하시며, 이 성중에 무엇이 많다고 하셨습니까?", "o": ["내 백성", "금은", "군사"]}, "q_year": {"q": "바울은 고린도에 얼마나 머물며 하나님의 말씀을 가르쳤습니까?", "o": ["일 년 육 개월", "석 달", "칠 년"]}, "q_charge18": {"q": "유대인들은 바울이 사람들을 무엇을 어기고 하나님을 섬기라고 권한다고 했습니까?", "o": ["율법", "성전", "안식일"]}, "q_gallio": {"q": "갈리오는 문제가 무엇에 관한 것이면 재판하지 않겠다고 했습니까?", "o": ["언어와 명칭과 그들의 법", "살인과 강도", "세금과 병역"]}, "q_soth": {"q": "무리는 회당장 누구를 붙잡아 재판 자리 앞에서 때렸습니까?", "o": ["소스데네", "디디오 유스도", "그리스보"]}, "q_vow": {"q": "바울은 서원이 있어 겐그레아에서 무엇을 했습니까?", "o": ["머리를 깎았다", "양을 드렸다", "사십 일 금식했다"]}, "q_return": {"q": "바울이 에베소를 떠나며 한 말은 무엇입니까?", "o": ["하나님의 뜻이면 너희에게 돌아오겠다", "다시는 오지 않겠다", "예루살렘으로 나를 찾아오라"]}, "q_church": {"q": "바울은 가이사랴에 상륙해 예루살렘에 올라가 무엇을 하고 안디옥으로 내려갔습니까?", "o": ["교회에 문안했다", "세금을 걷었다", "배표를 샀다"]}, "q_strong18": {"q": "바울이 갈라디아와 브루기아를 차례로 지나며 한 일은 무엇입니까?", "o": ["모든 제자를 굳게 했다", "관원을 세웠다", "헌금을 거두었다"]}, "q_apollos": {"q": "아볼로는 어디서 났고, 누구의 세례만 알았습니까?", "o": ["알렉산드리아 출신, 요한의 세례만 알았다", "다메섹 출신, 예수의 세례만 알았다", "고린도 출신, 할례만 알았다"]}, "q_prove": {"q": "아볼로는 아가야에서 성경으로 무엇을 증명하며 유대인을 힘 있게 반박했습니까?", "o": ["예수가 그리스도이심", "모세가 선지자임", "성전이 영원히 서리라는 것"]}}, "speak": {"s6": {"prompt": "회당 사람들이 대적하고 훼방합니다. 당신(바울)은 옷을 떨고 무엇이라 말합니까?", "o": ["“이 회당을 허물겠다.”", "@", "“내일 고린도를 떠나 전도를 그만두겠다.”"]}}, "ponder": "묵상 질문 (정해진 답은 없습니다)\n\n1. 3절에서 바울은 아굴라와 브리스길라와 같은 업이라 함께 천막을 만들었습니다. 일상의 일과 복음을 전하는 일은 어떻게 어우러진다고 생각합니까?\n\n2. 9–10절에서 주께서 밤에 ‘두려워하지 말라’, ‘이 성중에 내 백성이 많다’고 하십니다. 이 두 말씀은 각각 바울에게 어떤 힘이 되었겠습니까?\n\n3. 24–26절에서 이미 말솜씨가 뛰어난 아볼로가 브리스길라와 아굴라에게 하나님의 도를 더 정확히 풀어 듣습니다. 이것이 나에게 무엇을 일깨워 줍니까?"};

const HOTX={"acts-9": {"priest": {}, "desert": {"c1": [["我們奉命同行，他為甚麼走得這樣急？", "We were ordered to travel with him. Why is he in such a hurry?", "w"]], "c2": [["前面就是大馬士革了。", "Damascus is just ahead.", "w"]]}, "light": {"c1": [["那光……我睜不開眼睛。", "That light... I can't keep my eyes open.", "y"]], "c2": [["我聽見有聲音，卻看不見人。", "I heard a voice, but I can't see anyone.", "y"]]}, "fall": {"c1": [["他倒在地上了！", "He has fallen to the ground!", "y"]], "c2": [["我們站在這裡，說不出話來。", "We just stand here, unable to speak.", "y"]], "c3": [["聽見聲音，卻看不見人。", "We heard the voice, but we see no one.", "y"]]}, "gate": {"gd": [["那人眼睛看不見，是被人拉著手進城的。", "That man can't see. They're leading him into the city by the hand.", "w"]], "c1": [["來，慢慢走，拉著我的手。", "Come, slowly. Take my hand.", "w"]]}, "straight": {"m1": [["這條直街，我天天都走。", "I walk this Straight Street every day.", "w"]], "w1": [["聽說猶大家住了一位大數人，三天不吃也不喝。", "They say a man from Tarsus is staying at Judas's house, and has not eaten or drunk for three days.", "y"]]}, "lane": {"n1": [["亞拿尼亞，這麼急，要往哪裡去？", "Ananias, in such a hurry? Where are you going?", "w"]]}, "judas": {"anan": [["（他正在禱告。）", "(He is praying.)", "l"]]}, "bath": {"anan": [["我能看見了。", "I can see again.", "l"]], "b1": [["歡迎你，兄弟。", "Welcome, brother.", "w"]], "w2": [["他受洗了！", "He has been baptized!", "w"]]}, "meal": {"anan": [["吃過飯，我覺得有力氣了。", "I've eaten, and my strength has returned.", "w"]], "b1": [["和我們同住些日子吧。", "Stay with us for a few days.", "w"]], "w2": [["多吃一點，慢慢來。", "Eat more. Take your time.", "w"]]}, "syn9": {"h1": [["他不就是從前逼迫我們的人嗎？", "Isn't he the one who used to persecute us?", "y"]], "h2": [["怎麼現在說耶穌是神的兒子？", "How can he now say that Jesus is the Son of God?", "y"]], "h3": [["凡聽見的人，都驚奇。", "Everyone who heard him was amazed.", "y"]]}, "wall9": {"d1": [["快，筐子準備好了。", "Quick. The basket is ready.", "y"]], "d2": [["夜裡，不要出聲。", "It's night. Keep quiet.", "y"]], "g1": [["我們日夜守在城門，要找掃羅。", "We keep watch at the gate day and night, looking for Saul.", "y"]]}, "jer9": {"j1": [["他們都怕掃羅，不信他是門徒。", "They all fear Saul and don't believe he is a disciple.", "y"]], "j2": [["這個人從前捉拿我們的人。", "This man once hunted our people down.", "y"]], "j3": [["再看看吧。", "Let's wait and see.", "w"]], "barn": [["我來接待你。", "I will receive you.", "l"]], "ap1": [["你在路上怎麼看見主？說來聽聽。", "How did you see the Lord on the road? Tell us.", "w"]]}, "harbor9": {"fm": [["今天風向正好，船是不等人的。", "The wind is fair today. The ship won't wait for anyone.", "w"]], "gd": [["要上船的人，請排好隊，不要擠。", "Those boarding, please line up. Don't crowd.", "w"]], "cs": [["貨單都核過了，可以放行。", "The cargo list is checked. You may proceed.", "w"]], "ch": [["船好大！你也要坐船嗎？", "What a big ship! Are you going on it too?", "w"]], "pg1": [["聽說海上這季很平靜。", "They say the sea is calm this season.", "w"]], "pg2": [["我兒子在大數，我去看他。", "My son is in Tarsus. I'm going to see him.", "w"]], "w1": [["帶著餅，路上吃吧。", "Take some bread for the road.", "w"]], "vd": [["凱撒利亞的貨，要賣到大數去。", "These Caesarean goods are bound for Tarsus.", "w"]],"b1": [["往凱撒利亞的船快開了。", "The ship for Caesarea is about to leave.", "w"]], "b2": [["大數路途遙遠，路上保重。", "Tarsus is far. Take care on the way.", "w"]]}}, "acts-13": {"antioch": {"barn": [["聖靈說：要為我分派巴拿巴和掃羅。", "The Holy Spirit said: set apart Barnabas and Saul for me.", "l"]], "sim": [["我們禁食禱告，等候主。", "We fast and pray, waiting on the Lord.", "l"]], "luc": [["我們按手在你們身上，願主與你們同在。", "We lay our hands on you. May the Lord be with you.", "l"]], "man": [["要分別了，真捨不得你們。", "It is hard to say goodbye to you.", "w"]]}, "paphos": {"pro": [["我是巡撫，我想聽神的道。", "I am the proconsul. I want to hear the word of God.", "w"]], "ely": [["不要聽他們的！", "Don't listen to them!", "r"]], "g1": [["巡撫大人召見了這兩位。", "The proconsul has summoned these two men.", "w"]], "g2": [["有個術士在旁邊作對。", "A sorcerer is standing against them.", "y"]]}, "synagogue": {"ldr": [["兄弟們，若有勸勉眾人的話，請說。", "Brothers, if you have a word of encouragement for the people, please speak.", "w"]], "s1": [["摩西的律法，我們讀了多年。", "We have read the Law of Moses for many years.", "w"]], "s2": [["他提到大衛的後裔。", "He speaks of David's descendant.", "w"]], "s3": [["下個安息日，再來聽吧。", "Come back and hear more next Sabbath.", "w"]], "s4": [["這話，我們從來沒聽過。", "We have never heard words like these.", "w"]]}, "plaza": {"c1": [["全城的人，幾乎都來聽了。", "Almost the whole city has come to listen.", "w"]], "c2": [["外邦人聽見，就歡喜了。", "When the Gentiles heard this, they rejoiced.", "l"]], "c3": [["主的道，傳遍了那一帶地方。", "The word of the Lord spread through the whole region.", "l"]], "c4": [["我也要信這道。", "I want to believe this way too.", "w"]], "c5": [["他們為甚麼把使徒趕出去？", "Why are they driving the apostles out?", "y"]], "c6": [["門徒卻滿心喜樂。", "Yet the disciples were filled with joy.", "l"]], "j1": [["這些人搶走我們的聽眾！", "These men are taking our audience!", "r"]], "j2": [["去挑唆那些敬神的婦女和尊貴的人。", "Go and stir up the devout women and the leading men.", "y"]]}}, "acts-14": {"synagogue": {"ldr": [["他們一講道，猶太人和希臘人信的很多。", "When they spoke, a great many Jews and Greeks believed.", "w"]], "s1": [["我信了。", "I believe.", "l"]], "s2": [["他們講的，是新的道理。", "What they teach is something new.", "y"]], "s3": [["不信的猶太人在煽動眾人。", "The unbelieving Jews are stirring people up.", "y"]], "s4": [["我們得小心。", "We must be careful.", "y"]]}, "lystra14": {"lame": [["保羅對我說：你起來，兩腳站直！", "Paul said to me: Stand up on your feet!", "w"]], "c1": [["神藉著他們行了神蹟！", "God has worked a wonder through them!", "y"]], "c2": [["神明借著人形，降臨在我們中間了！", "The gods have come down to us in human form!", "y"]], "c3": [["稱巴拿巴為宙斯，保羅為希耳米。", "Call Barnabas Zeus, and Paul Hermes.", "y"]], "c4": [["快去牽牛、拿花圈來！", "Quick, bring oxen and garlands!", "y"]], "pr": [["我要把牛獻給他們。", "I will offer oxen to them.", "y"]]}, "plaza": {"c1": [["有人從安提阿來，說他們的壞話。", "Someone has come from Antioch, speaking against them.", "y"]], "c2": [["把他拉到城外去！", "Drag him out of the city!", "r"]], "c3": [["他動也不動了。", "He isn't moving at all.", "y"]], "c4": [["他死了嗎？", "Is he dead?", "y"]], "c5": [["門徒圍著他，他竟站起來了。", "The disciples gathered around him, and he stood up.", "l"]], "c6": [["明天他往特庇去。", "Tomorrow he goes on to Derbe.", "w"]], "j1": [["石頭，再多一點！", "More stones!", "r"]], "j2": [["我們追到這裡也夠了。", "We have followed them far enough.", "y"]]}, "antioch": {"barn": [["我們回來了，要把神所行的事告訴大家。", "We're back, to tell everyone what God has done.", "w"]], "sim": [["神為外邦人開了信道的門。", "God has opened a door of faith to the Gentiles.", "l"]], "luc": [["你們離開了好久呢。", "You have been away a long time.", "w"]], "man": [["留下來，和門徒同住些日子吧。", "Stay and live among the disciples for a while.", "w"]]}}, "acts-16": {"road": {"tim": [["我母親是猶太人，父親是希臘人。", "My mother is Jewish, and my father is Greek.", "w"], ["弟兄們都稱讚我。", "The believers speak well of me.", "w"]]}, "vision": {"mac": [["請你過到馬其頓來，幫助我們。", "Come over to Macedonia and help us.", "l"]]}, "riverside": {"lyd": [["我敬拜神，是賣紫色布的。", "I worship God, and I sell purple cloth.", "w"]], "w1": [["安息日，我們都在河邊禱告。", "On the Sabbath we all pray by the river.", "l"]], "w2": [["這幾位是從哪裡來的？", "Where have these men come from?", "w"]], "w3": [["他們講的道，我很想聽。", "I would love to hear what they teach.", "w"]]}, "street": {"girl": [["這些人是至高神的僕人！", "These men are servants of the Most High God!", "y"]], "lyd": [["請到我家裡來住。", "Come and stay at my house.", "w"]], "b1": [["弟兄，保重。", "Take care, brother.", "w"]], "b2": [["願主與你們同在。", "May the Lord be with you.", "l"]]}, "market": {"mg1": [["打他們！", "Beat them!", "r"]], "mg2": [["打完以後，下在監裡。", "When they are beaten, throw them in prison.", "r"]], "ms1": [["我們的財路沒有了！", "Our hope of making money is gone!", "r"]], "ms2": [["這些猶太人擾亂我們的城！", "These Jews are disturbing our city!", "r"]], "c1": [["他們被鞭打了。", "They are being flogged.", "y"]], "c2": [["為甚麼不問罪，就打人？", "Why beat men without a trial?", "y"]]}, "cell": {"p1": [["半夜了，他們還在禱告唱詩。", "It's midnight, and they're still praying and singing hymns.", "l"]], "p2": [["別的囚犯，都在聽著呢。", "The other prisoners are all listening.", "w"]], "silas": [["我們都在這裡，不要逃走。", "We are all still here. Don't run away.", "l"]]}, "court": {"jail": [["官長打發人來說：釋放那兩個人。", "The magistrates have sent word: release those two men.", "w"]], "f1": [["他們竟是羅馬人？", "They are Roman citizens?", "y"]], "f2": [["我們打了羅馬人！", "We flogged Roman citizens!", "y"]], "f3": [["官長們都害怕了。", "The magistrates are afraid.", "y"]]}, "house": {"jail": [["我信了，請把主的話，也告訴我全家。", "I believe. Please tell my whole household the word of the Lord too.", "l"]], "f1": [["請坐，先吃點東西吧。", "Please sit down and eat something first.", "w"]], "f2": [["我也要受洗。", "I want to be baptized too.", "l"]], "f3": [["全家因為信了神，都歡喜快樂。", "The whole household is full of joy because they believe in God.", "l"]]}, "dawn": {"jail": [["請你們平平安安地出去吧。", "Please go out in peace.", "w"]], "o1": [["我們奉命，釋放你們。", "We were ordered to release you.", "w"]], "o2": [["官長親自來了。", "The magistrates are coming in person.", "y"]]}}};
const HOTE={"acts-22":{"temple22":{"lv":[["這裡是耶和華的殿，請安靜禱告。","This is the house of the Lord. Please pray quietly.","w"]],"w1":[["我每天早晚都來這裡禱告。","I come here to pray every morning and evening.","w"]]}},"gal":{"galdesk":{"tr":[["我一路從加拉太走來，想快點見到你。","I came all the way from Galatia. I wanted to see you quickly.","w"]],"barn":[["保羅，把心裡的話，一個字一個字寫下來。","Paul, write down what is in your heart, one word at a time.","w"]]},"arabia":{"nm":[["這裡白天很熱，夜裡很冷。","The days here are hot and the nights are cold.","w"],["荒野很靜，什麼都聽得見。","The desert is quiet. You can hear everything.","w"]]},"galjer":{"ja":[["我們伸出右手，是同工的記號。","We gave the right hand of fellowship as a sign of partnership.","w"]],"pe":[["主差我去向受割禮的人傳福音。","The Lord sent me to preach the gospel to the circumcised.","w"]],"jo":[["各人向各人的地方去，彼此同工。","Each goes to his own people, and we work side by side.","w"]],"ti":[["我是希臘人，他們沒有勉強我受割禮。","I am a Greek, and no one forced me to be circumcised.","w"]],"barn":[["我們帶來的捐項，已經交給他們了。","We have handed over the gift we brought.","w"]]},"galtable":{"pe":[["……我怕那些受割禮的人。","...I fear those who are circumcised.","w"]],"g1":[["我們坐在這裡一起吃飯，真好。","It is good for us to sit here and eat together.","w"]],"g2":[["我從前不能和猶太人同桌，現在可以了。","I could never sit with Jews at a table before. Now I can.","w"]],"g3":[["今天的餅，是大家一起烤的。","Today’s bread was baked by all of us together.","w"]],"barn":[["連我也被他們的假裝帶走了。","Even I was carried away by their pretending.","w"]]}},"acts-11":{"tarsus11":{"t1":[["這批帳棚布，要趕在月底送上船。","This tent cloth has to be on the boat before the month ends.","w"],["基利家的山羊毛又粗又韌，最適合做帳棚。","Cilician goat hair is coarse and tough. It makes the best tent cloth.","w"]],"t2":[["河水一年比一年淺了。","The river gets a little shallower every year.","w"],["那位做帳棚的，話不多，手卻很快。","The tentmaker over there says little, but his hands are fast.","w"]],"t3":[["師傅說，針腳要密，風才吹不進去。","The master says the stitches must be tight, or the wind gets through.","w"]],"barn":[["這些帳棚，是你親手做的嗎？","Did you make these tents with your own hands?","w"]]},"antioch11":{"a1":[["這裡有猶太人，也有希臘人，大家坐在一起聚會。","Jews and Greeks sit together here.","w"],["外面的人叫我們「基督徒」，就是屬基督的人。","Outsiders call us ‘Christians’, people who belong to Christ.","w"]],"a2":[["我本來拜別的神。聽了耶穌的事，就信了。","I used to worship other gods. Then I heard about Jesus, and I believed.","w"]],"a3":[["我們從耶路撒冷逃難出來，到這裡才又有了家。","We fled Jerusalem, and here we found a home again.","w"]],"man":[["我說的，是聖靈指示我的。","What I say, the Spirit has shown me.","w"]],"barn":[["你看，這麼多人願意學。你來教他們。","See how many want to learn? Come and teach them.","w"]]},"jer11":{"mark":[["我跟著他們，去安提阿。","I will go with them to Antioch.","w"]],"e1":[["安提阿的弟兄，離這麼遠還想著我們。","The brothers in Antioch think of us, even from so far away.","w"]],"e2":[["饑荒的消息，早就傳到耶路撒冷了。","News of the famine reached Jerusalem long ago.","w"]],"e3":[["糧食不夠的人家，我們一家一家記著。","We keep track of every household that is short of grain.","w"]],"barn":[["我們把心意帶到了。","We have brought the gift.","w"]]}},"acts-9": {"harbor9":{"b1": [["船快開了，掃羅，路上保重。", "The ship is about to leave, Saul. Take care on the road.", "w"]], "b2": [["到了大數，記得捎個信來。", "When you reach Tarsus, send us word.", "w"]], "sl": [["往大數的船，風一起就開。", "The ship for Tarsus sails as soon as the wind rises.", "w"]], "pt": [["貨都裝上船了，只等開船。", "All the cargo is loaded. We only wait to sail.", "w"]], "mr": [["這季的船，今天是最後一班。", "This is the last ship of the season today.", "w"]]},"ananin": {"anan": [["主，我在這裡。", "Here I am, Lord.", "l"]], "lord": [["你只管去，他是我所揀選的器皿。", "Go! He is My chosen instrument.", "l"]]}, "dream": {"anan": [["（異象中，有人進來按手在他身上，叫他能看見。）", "(In the vision, a man comes in and lays hands on him so that he may see.)", "l"]]}, "lane": {"anan": [["我要往直街去，猶大的家。", "I'm going to Straight Street, to the house of Judas.", "w"]]}},"acts-8":{"crowd8":{"cw0":[["他說他看見天開了？這是褻瀆！","He says he sees heaven opened? That is blasphemy!","r"]],"cw1":[["律法上寫著呢，該怎麼辦就怎麼辦。","The Law says what must be done.","r"]],"cw2":[["再不處理，整個耶路撒冷都要亂了。","If we don’t deal with this, all Jerusalem will be in uproar.","r"]],"cw3":[["別擋著，我要看得清楚。","Don’t block me. I want to see.","r"]],"v0":[["新鮮的無花果，便宜賣囉！","Fresh figs, a good price!","w"],["客人都跑去那邊了……那邊好像出了什麼事。","All my customers ran over there… something seems to be happening.","w"]],"v1":[["今天的橄欖油特別好。","The olive oil is especially good today.","w"]],"v2":[["咦，那邊吵吵鬧鬧的，不知道出了什麼事。","Hm, it’s so noisy over there. I wonder what happened.","w"]],"v3":[["我要送貨，路都被堵住了。那邊怎麼這麼吵？","I have a delivery, and the road is blocked. Why is it so loud over there?","w"]]}}};
HOTE['acts-16']=Object.assign(HOTE['acts-16']||{},{
 lys16:{mom:[["他父親不是猶太人，可是我一直教他認識主。","His father is not a Jew, but I have always taught him to know the Lord.","w"]],dad:[["我是希臘人，可是我看著這孩子長大。","I am a Greek, but I have watched this boy grow up.","w"]],b1:[["他做事穩重，弟兄們都信得過他。","He is steady, and the brothers trust him.","w"]],b2:[["我從以哥念來，那邊的人也提起過他。","I came from Iconium. People there speak of him too.","w"]],b3:[["有人願意跟保羅去，這可不容易。","It is not easy to go with Paul.","w"]],silas:[["耶路撒冷的信，我們帶在身上。","We carry the letter from Jerusalem with us.","w"]]},
 circ16:{el1:[["我們都知道他父親是希臘人。","We all know his father is a Greek.","w"]],el2:[["這樣，那一帶的猶太人就沒有話說了。","Then the Jews in these places will have nothing to say.","w"]],silas:[["這是為了那些地方的猶太人。","This is for the sake of the Jews in those places.","w"]]},
 gate16:{el3:[["耶路撒冷的條規？我們一定遵守。","The decisions from Jerusalem? We will keep them.","w"]],el4:[["我們要把這信念給每一個人聽。","We will read this letter to everyone.","w"]],silas:[["各城的教會都在等這封信。","The churches in every town are waiting for this letter.","w"]],d1:[["我也是新來的，天天有人加入我們。","I am new too. Every day more people join us.","w"]],d2:[["教會一天比一天堅固。","The church grows stronger every day.","w"]],d3:[["我年紀大了，但我也信了。","I am old, but I have believed.","w"]],d4:[["我帶了家人一起來。","I brought my family with me.","w"]]},
 mysia16:{silas:[["往庇推尼的路，我們不能走。","We cannot take the road to Bithynia.","w"]],tim:[["那道光……不讓我們往前。","That light does not let us go on.","w"]]},
 troas16:{s1:[["明天一早有船開往對岸。","A ship sails for the other shore early tomorrow.","w"]],s2:[["特羅亞的港口，天天都有人來人往。","The harbor of Troas is busy every day.","w"]],s3:[["海上風不大，是出航的好天氣。","The wind is light. Good weather to sail.","w"]],silas:[["我們要往對岸去了。","We are crossing to the other shore.","w"]],tim:[["馬其頓是怎樣的地方呢？","What kind of place is Macedonia?","w"]]}
});

  { const w=document.createElement('button'); w.textContent=SOON[L]; w.disabled=true; w.style.cssText='border-bottom:2px solid var(--line);background:#e8dcc0;color:var(--dim);font-size:.8em;min-height:30px;padding:2px 7px;margin-bottom:-2px;opacity:.55;cursor:default'; tabs.appendChild(w); }
  const A=VIS.filter(function(a){ return a.id===viewAct; })[0]||VIS[0];
  /* 第二層:面板(章) */
  const pan=document.createElement('div');
  pan.style.cssText='width:100%;box-sizing:border-box;background:var(--panel);border:2px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:6px';
  const hd=document.createElement('div'); hd.style.cssText='font-size:.8em;color:var(--dim)'; hd.textContent=A.t[L]+(A.yr?' · '+YR[L]+A.yr:''); pan.appendChild(hd);
  const row=document.createElement('div'); row.style.cssText='display:flex;flex-wrap:wrap;gap:4px'; pan.appendChild(row);
  A.ch.filter(function(c){ return c.id; }).forEach(function(c){
    const b=document.createElement('button');
    if(c.id){
      b.textContent=chLabel(c.id)+((P_.prog[c.id]&&P_.prog[c.id].done)?' ✓':''); b.className=(c.id===cur)?'on':'';
      b.onclick=function(){ setChapter(c.id); }; chBtns[c.id]=b;
    } else {
      b.textContent=c.p[L]+'（'+SOON[L]+'）'; b.disabled=true; b.style.opacity='.45'; b.style.cursor='default';
    }
    row.appendChild(b);
  });
  box.appendChild(pan);
}
function setChapter(id,instant){
  if(!DATA.story[id]||(started&&id===STORY.id&&!instant)) return;
  const go=function(){ STORY=DATA.story[id]; STEPS=STORY.steps; seen.clear(); cur=0; const ttl=TXT().title||UIs().title; document.title=ttl; $('title').textContent=ttl; renderChBtns(); startChapter(); };
  if(instant||!started) go(); else transitionTo(go);
}
function renderFoot(){
  const u=UIs();
  $('foot').textContent=DATA.versions[verKey()].notice+' '+u.msg.foot+(storageOK?'':'\n'+u.msg.noStore);
  $('mclr').textContent=armed?u.btn.confirmClear:u.btn.clearSave; $('mbtn').textContent=u.btn.menuBtn; $('mclose').textContent=u.btn.menuClose;
}
function redraw(){
  const s=STEPS[cur]; if(!s) return;
  if(s.t==='say'||s.t==='read'||s.t==='quiz'||s.t==='speak'||s.t==='walk'||s.t==='write'||s.t==='end') run(cur);
}
function setLang(l){
  if(!DATA.langs[l]) return;
  lang=l;
  document.documentElement.lang=DATA.langs[l].htmlLang;
  document.body.className='lang-'+l;
  const ttl=TXT().title||UIs().title; document.title=ttl; $('title').textContent=ttl;
  Object.keys(langBtns).forEach(function(k){ langBtns[k].className=(k===l)?'on':''; });
  P_.lang=l; persist();
  renderFoot(); renderChBtns(); setPlace(curPlaceKey); setCount();
  if(pendingResume) showResumePrompt(); else if(started) redraw();
  if(menuOpen) renderMenu();
}
function buildLangButtons(){
  const box=$('langs'); box.innerHTML='';
  Object.keys(DATA.langs).forEach(function(l){
    const b=document.createElement('button'); b.textContent=DATA.langs[l].label;
    b.onclick=function(){ setLang(l); };
    langBtns[l]=b; box.appendChild(b);
  });
}

/* ---------- 輸入:點地面走路、方向鍵 ---------- */
cv.addEventListener('pointerdown',function(e){
  if(busy||locked||!S||!paulA) return;
  if(bub){ e.preventDefault(); if(typing) skipTyping(); else if(curBtns.length===1) curBtns[0][1](); return; }
  const r=cv.getBoundingClientRect();
  const sx=(e.clientX-r.left)*CW/r.width, sy=(e.clientY-r.top)*CH/r.height;
  const g=inv(sx,sy);
  if(tapInteract(sx,sy)){ e.preventDefault(); return; }
  pendTap=null;
  const gx=Math.max(0.5,Math.min(G-0.5,g[0])), gy=Math.max(0.5,Math.min(G-0.5,g[1]));
  tapFx={gx:gx,gy:gy,t:0}; walkTo(gx,gy);
  e.preventDefault();
});
const keys={};
document.addEventListener('keydown',function(e){
  if(menuOpen){ if(e.key==='Escape') closeMenu(); return; }
  const k=e.key.toLowerCase();
  if(k==='enter'||k===' '){
    if(typing){ e.preventDefault(); skipTyping(); }
    else if(curBtns.length===1){ e.preventDefault(); curBtns[0][1](); }
    return;
  }
  if((k==='x'||k==='e')&&useWait&&!typing&&curBtns.length===1){ e.preventDefault(); curBtns[0][1](); return; }
  const n=parseInt(e.key,10);
  if(n>=1&&n<=curBtns.length&&curBtns.length>1&&!typing){ curBtns[n-1][1](); return; }
  keys[k]=true;
});
document.addEventListener('keyup',function(e){ keys[e.key.toLowerCase()]=false; });
function applyKeys(dt){
  if(locked||busy) return;
  let vx=0, vy=0;
  if(keys['arrowup']||keys['w']){ vx-=1; vy-=1; }
  if(keys['arrowdown']||keys['s']){ vx+=1; vy+=1; }
  if(keys['arrowleft']||keys['a']){ vx-=1; vy+=1; }
  if(keys['arrowright']||keys['d']){ vx+=1; vy-=1; }
  if(!vx&&!vy) return;
  const l=Math.sqrt(vx*vx+vy*vy); vx/=l; vy/=l;
  paulA.path=[];
  const nx=paulA.gx+vx*SPEED*dt, ny=paulA.gy+vy*SPEED*dt;
  const free=function(x,y){ return !cellBlocked(Math.floor(x*RES),Math.floor(y*RES)); };
  if(free(nx,ny)){ paulA.gx=nx; paulA.gy=ny; } else if(free(nx,paulA.gy)){ paulA.gx=nx; } else if(free(paulA.gx,ny)){ paulA.gy=ny; }
  paulA.kbMove=true; paulA.moving=true; faceFromMove(paulA,vx,vy);
}
$('sub').addEventListener('click',skipTyping);

/* ---------- 主迴圈與啟動 ---------- */
let lastT=0;
function frame(ts){
  const t=ts/1000, dt=Math.min(0.05,(t-lastT)||0.016); lastT=t;
  if(S&&paulA){ applyKeys(dt); update(dt); render(t); }
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
}
function initialChapter(){
  try{ const h=(typeof location!=='undefined')?(location.hash||'').replace('#',''):''; const t=h.split(/[,&]/).filter(function(x){ return DATA.story[x]; }); if(t.length) return t[0]; }catch(e){}
  if(DATA.story['acts-8']&&!(P_.prog&&P_.prog['acts-8']&&P_.prog['acts-8'].done)) return 'acts-8';
  return (P_.ch&&DATA.story[P_.ch])?P_.ch:STORY.id;
}
function initialLang(){
  let l=(P_.lang&&DATA.langs[P_.lang])?P_.lang:'zh';
  try{
    const h=(typeof location!=='undefined')?(location.hash||'').replace('#',''):'';
    h.split(/[,&]/).forEach(function(x){ if(DATA.langs[x]) l=x; });
  }catch(e){}
  return l;
}
function startGame(){
  buildLangButtons(); loadSave(); $('mclr').onclick=clearSave; $('mbtn').onclick=openMenu; $('mclose').onclick=closeMenu;
  $('menu').onclick=function(ev){ if(ev.target===this) closeMenu(); };
  STORY=DATA.story[initialChapter()]; STEPS=STORY.steps;
  setLang(initialLang());
  resumeReady=true; startChapter(); started=true;
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
}

startGame();
</script>
